{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="panel">
  <h2 style="margin-top:0">Create your account</h2>
  {% if error %}<div class="msg err">⚠️ {{ error }}</div>{% endif %}
  <form method="post" action="/register">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">Username</label>
    <input id="username" name="username" value="{{ username }}" autocomplete="username" required autofocus>
    <label for="password">Password <span class="opt">(at least 8 characters)</span></label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
    <label for="confirm">Confirm password</label>
    <input id="confirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required>
    {% if offer_import %}
    <label style="font-weight:400;display:flex;gap:8px;align-items:center;margin-top:16px">
      <input type="checkbox" name="import_old" value="1" checked style="width:auto">
      Import the expenses I saved before sign-in existed
    </label>
    {% endif %}
    <label style="font-weight:400;display:flex;gap:8px;align-items:flex-start;margin-top:16px">
      <input type="checkbox" name="agree_terms" value="1" style="width:auto;margin-top:4px" required>
      <span>I am 18 or older and I accept the <a href="/privacy" target="_blank">Privacy Policy</a> and <a href="/terms" target="_blank">Terms</a>.</span>
    </label>
    <button class="go" type="submit">Create account</button>
  </form>
  <p class="hint">Already have an account? <a href="/login">Sign in</a></p>
</div>
{% endblock %}
